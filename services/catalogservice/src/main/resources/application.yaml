server:
  port: 9003

spring:
  application:
    name: catalog-service

  datasource:
    url: jdbc:mysql://localhost:3307/eventhub_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: eventhub_user
    password: eventhub_pass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: false