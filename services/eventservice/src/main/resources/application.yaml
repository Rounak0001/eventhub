server:
  port: 9004

spring:
  application:
    name: event-service

  datasource:
    url: jdbc:mysql://localhost:3307/EventZen_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: EventZen_user
    password: EventZen_pass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: false
