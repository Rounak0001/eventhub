server:
  port: 9001

spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: auth-service

  datasource:
    url: jdbc:mysql://localhost:3307/EventZen_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: EventZen_user
    password: EventZen_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 45000
      max-lifetime: 55000
      keepalive-time: 30000
      minimum-idle: 1
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: false

jwt:
  secret: ${JWT_SECRET}
  expiration: 8640000
